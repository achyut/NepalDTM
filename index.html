<!DOCTYPE html>
<html lang="en">
<head>
<title>NepalDTM</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
    body { margin: 0; padding: 0; font: 14px/1.4 system-ui, sans-serif; }
    html, body, #map { height: 100%; }
    .panel {
        position: absolute; top: 10px; left: 10px; z-index: 1;
        background: rgba(255,255,255,0.93); border-radius: 8px;
        padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        max-width: 340px;
    }
    .panel h1 { font-size: 16px; margin: 0 0 6px; }
    .panel p { margin: 4px 0; font-size: 12px; color: #555; }
    .panel button {
        margin: 3px 2px; padding: 4px 10px; cursor: pointer;
        border: 1px solid #ccc; border-radius: 4px; background: #fff;
        font-size: 12px;
    }
    .panel button:hover { background: #e8f0fe; }
    .panel label { display: block; margin-top: 8px; font-size: 12px; }
    .panel input[type=range] { width: 100%; }
    #info { margin-top: 8px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
    <h1>NepalDTM</h1>
    <p>National 8 m bare-earth terrain. Held-out ICESat-2 RMSE 6.1 m.</p>
    <div id="places"></div>
    <label>Exaggeration: <span id="exag-val">1.5</span>×
        <input type="range" id="exag" min="0.5" max="4" step="0.1" value="1.5">
    </label>
    <label><input type="checkbox" id="hillshade" checked> Hillshade</label>
    <div id="info"><a href="paper/paper.pdf">Paper</a></div>
</div>

<script type="module">
import maplibregl from 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.mjs';
import * as pmtiles from 'https://unpkg.com/pmtiles@4.0.0/dist/pmtiles.js';

const PMTILES_URL = 'https://pub-7a51429102ce456f85c0aee664338f8f.r2.dev/NepalDTM.pmtiles';

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const places = {
    'Nepal':     {center: [84.1, 28.3], zoom: 6.6, bearing: 0, pitch: 45},
    'Everest':   {center: [86.925, 27.988], zoom: 12, bearing: -20, pitch: 70},
    'Annapurna': {center: [83.82, 28.596], zoom: 11, bearing: 10, pitch: 68},
    'Kathmandu': {center: [85.32, 27.7], zoom: 11, bearing: -10, pitch: 60},
    'Pokhara':   {center: [83.96, 28.25], zoom: 10.5, bearing: 0, pitch: 65},
    'Khumbu':    {center: [86.84, 27.94], zoom: 12.5, bearing: 30, pitch: 70},
};

const placesDiv = document.getElementById('places');
for (const [name, view] of Object.entries(places)) {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.onclick = () => map.flyTo({...view, duration: 2500});
    placesDiv.appendChild(btn);
}

const map = new maplibregl.Map({
    container: 'map',
    style: {
        version: 8,
        sources: {
            osm: {
                type: 'raster',
                tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                tileSize: 256,
                attribution: '&copy; OpenStreetMap contributors',
            },
            'NepalDTM': {
                type: 'raster-dem',
                url: `pmtiles://${PMTILES_URL}`,
                tileSize: 256,
                encoding: 'terrarium',
            },
        },
        layers: [
            {id: 'osm', type: 'raster', source: 'osm'},
            {id: 'hillshade', type: 'hillshade', source: 'NepalDTM',
             paint: {'hillshade-exaggeration': 0.4, 'hillshade-shadow-color': '#333'}},
        ],
        terrain: {source: 'NepalDTM', exaggeration: 1.5},
    },
    center: [84.2, 28.4],
    zoom: 7,
    pitch: 50,
    bearing: 0,
    maxPitch: 85,
});

map.addControl(new maplibregl.NavigationControl());

document.getElementById('exag').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.getElementById('exag-val').textContent = v.toFixed(1);
    map.setTerrain({source: 'NepalDTM', exaggeration: v});
});

document.getElementById('hillshade').addEventListener('change', (e) => {
    map.setLayoutProperty('hillshade', 'visibility', e.target.checked ? 'visible' : 'none');
});
</script>
</body>
</html>
